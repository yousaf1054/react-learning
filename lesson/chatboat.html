<!doctype html>
<html>
  <head>
    <title>chatboat</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput() {
        const [inputText, setInputText] = React.useState([""]);
        function saveInputText(event) {
          setInputText(event.target.value);
        }
        function sendMessages() {
          setChatMessages([
            ...chatMessages,
            {
              message: "test",
              sender: "user",
              id: crypto.randomUUID(),
            },
          ]);
        }

        return (
          <>
            <input
              placeholder="send a message to chatboat"
              size="30"
              onChange={saveInputText}
            />
            <button onClick={sendMessages}>send</button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        // const message = prps.message
        // const sender = props.sender shortcuts under
        // const { message, sender } = props; its simpler short cut is in the upper
        /*if (sender === "chatboat") {
            return (
              <div>
                <img src="robot.png" width="50" />
                {message}
              </div>
            );
          }*/
        return (
          <div>
            {sender === "chatboat" && (
              <img src="../asset/robot.png" width="50" />
            )}
            {message}
            {sender === "user" && <img src="../asset/user.png" width="50" />}
          </div>
        );
      }

      function ChatMessages() {
        const [chatMessages, setChatMessages] = React.useState([
          { message: "hello chatboat", sender: "user", id: "1" },
          {
            message: "Hello ! How can I help you today?",
            sender: "chatboat",
            id: "2",
          },
          { message: "can you get me today date ?", sender: "user", id: "3" },
          {
            message: `its ${new Date().toLocaleDateString()}`,
            sender: "chatboat",
            id: "4",
          },
        ]);
        //const [chatMessages, setChatMessages] = array;
        //const chatMessages=arry[0]
        //const setChatMessages=array[1]

        return (
          <>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </>
        );
      }

      function App() {
        return (
          <>
            <ChatInput />
            <ChatMessages />
          </>
        );
      }
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
